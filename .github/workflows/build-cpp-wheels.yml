name: build-cpp-wheels

# Build + functional-smoke validation of the chilmesh_cpp binary wheels on
# Linux (manylinux x86_64), macOS (x86_64 + arm64) and Windows (AMD64).
# Manual dispatch; uploads wheels as artifacts ONLY, it does NOT publish to PyPI.
# The cibuildwheel test step RUNS full_init on a tiny mesh (src/chilmesh_cpp/
# smoke_test.py), not just a hasattr probe, so a broken/empty binary fails the
# build (#256 Phase 1a/1b). Refs #229, #163, #234, #225.
#
# Keep the matrix, cibuildwheel pin and CIBW_* env in sync with
# publish-cpp-wheels.yml.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wheels:
    name: cibuildwheel chilmesh_cpp (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest, archs: x86_64 }
          # macos-13 (the old Intel runner) was retired by GitHub; macos-15-intel
          # is its Intel replacement. macos-14 is Apple silicon (arm64).
          - { name: macos-x86_64, os: macos-15-intel, archs: x86_64 }
          - { name: macos-arm64, os: macos-14, archs: arm64 }
          - { name: windows-amd64, os: windows-latest, archs: AMD64 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      # 3.1.0 made CPython 3.14 a default build target; 3.3.0 is the pin.
      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==3.3.0
      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse src/chilmesh_cpp
        env:
          # cp314t (free-threaded) is not matched by "cp314-*", so it is not built.
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_ARCHS: ${{ matrix.archs }}
          CIBW_SKIP: "*-musllinux*"
          # C++17 floor for macOS (aligned allocation, std::filesystem). 10.15
          # is also cibuildwheel's own minimum for CPython 3.14 on x86_64;
          # arm64 is raised to 11.0 automatically.
          MACOSX_DEPLOYMENT_TARGET: "10.15"
          CIBW_TEST_REQUIRES: "numpy"
          # The smoke lives in a script file: a folded `python -c "..."` is run
          # through cmd.exe on Windows, where nested quoting is fragile.
          # {package} is the package dir passed to cibuildwheel (src/chilmesh_cpp); {project} is the repo root.
          CIBW_TEST_COMMAND: python {package}/smoke_test.py
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: chilmesh-cpp-wheels-${{ matrix.name }}
          path: wheelhouse/*.whl
          if-no-files-found: error
