name: code-smell

# Issue #267. Continuous static analysis so findings do not re-accumulate.
# Hard gate: ruff correctness rules (F) and bandit MEDIUM+ in src/.
# Advisory: ruff style rules (E), radon complexity, bandit LOW.

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"   # weekly, Monday 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-smell-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: ruff + bandit + radon
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          check-latest: true

      - name: Install scanners
        run: python -m pip install --upgrade pip ruff bandit radon

      - name: ruff correctness rules (gate)
        run: ruff check src tests scripts --select F --output-format github

      - name: ruff style rules (advisory)
        continue-on-error: true
        run: ruff check src tests scripts --select E --statistics

      - name: bandit MEDIUM+ in src (gate)
        run: bandit -q -r src -ll

      - name: bandit LOW report (advisory)
        continue-on-error: true
        run: bandit -q -r src -l || true

      - name: radon complexity D/E (advisory)
        continue-on-error: true
        run: radon cc src -s -n D
